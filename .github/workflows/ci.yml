# Shared CI pipeline. Written ONCE, copied to five repositories.
#
# Five repositories with five different pipelines is five things to maintain, and four of them drift.
#
# The step order is deliberate: the cheapest checks that catch the most dangerous problems run first.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest

    # A REAL Postgres. Not a mock.
    #
    # These tests are the only thing between a subtly wrong isolation policy and silent
    # cross-facility disclosure — and the failure mode is SILENT. Nothing errors; the wrong
    # data simply arrives. A mock confirms whatever it is asked.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: citadel_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # ---------------------------------------------------------------------
      # ★ G2 — THE CONTRACTS PIN CHECK
      #
      # Five lines, and the entire defence against the failure a five-repository
      # structure risks: a BRANCH dependency means the contract changes without
      # any consumer committing anything. Everything compiles, nothing works,
      # and the error appears at runtime in a third place.
      #
      # It runs SECOND — before install — because it is the cheapest check that
      # catches the most dangerous problem.
      # ---------------------------------------------------------------------
      - name: contracts pin is an exact tag, never a branch
        run: ./check-repo.sh

      # npm normalises the github https pin to git+ssh in the lockfile, and the runner has no
      # SSH key — so ssh URLs are always rewritten to https. The repos are public and anonymous
      # https clones work; if they ever go private again, set CONTRACTS_READ_TOKEN (org secret:
      # fine-grained PAT, read-only Contents on contracts) and the rewrite carries it.
      - name: route npm's git fetches over https (with token if one exists)
        env:
          TOKEN: ${{ secrets.CONTRACTS_READ_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
            git config --global --add url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          else
            git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          fi

      - run: npm ci

      - name: lint and format
        run: npm run lint --if-present

      - name: typecheck
        run: npm run typecheck --if-present

      - name: test
        run: npm test
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5432
          TEST_DB_NAME: citadel_test
          TEST_OWNER_USER: postgres
          TEST_OWNER_PASSWORD: test

      - name: build
        run: npm run build --if-present

      # Conformance runs in BOTH the service's CI (against the real thing) and
      # every consumer's CI (against a contract-conformant double). Both are
      # tested against ONE suite — that is what makes separate repositories safe.
      - name: contract conformance
        run: npm run conformance --if-present

      # ---------------------------------------------------------------------
      # The prior attempt had NO dependency scanning. Adding it later means
      # fixing everything it would have caught.
      # ---------------------------------------------------------------------
      - name: dependency vulnerabilities
        run: npm audit --audit-level=high
