# Batch B1 — HZ-HVCA-001
#
# Hazard, vulnerability and capacity assessment, DERIVED FROM the PAHO
# *Resilient Hospitals* guidance, section 1.1.
#
# ============================================================================
# DERIVED, NOT INHERITED
# ============================================================================
# The prior attempt's catalogue holds a tool with this identifier. `DEC-001`
# governs: it is a CANDIDATE INPUT and a source of identifiers -- not an
# inheritance. Every item below was structured from the source extract and
# cites the page it came from. See ../../registers/reconciliation-log.md.
#
# LIFECYCLE STATE IS `draft`, DELIBERATELY.
# It cannot become `approved` here: approval requires a reviewer who is not an
# editor, and `A4` has not named one. The rules enforce that -- `canApprove`
# checks the EDITOR LIST, not merely the recorded author.

id: HZ-HVCA-001
version: "1.0.0"

title:
  key: tool.hz_hvca_001.title
  fallback: Hazard, vulnerability and capacity assessment
purpose:
  key: tool.hz_hvca_001.purpose
  fallback: >-
    Identify the hazards a facility credibly faces, the vulnerabilities that make it
    susceptible to them, and the capacities it can rely on — so that preparedness is
    decided from evidence rather than from assumption.

# Class A: issued by an international health body, reproduced under its own
# licence. The prior tool was `mixed`, because it combined this material with
# locally-authored items. Deriving from source separates them -- see the
# reconciliation log, finding R-03.
authorityClass: A
classification: checklist
dominantResponseType: structured-finding
riskTier: general

# Not a clinical or engineering instrument: it directs a facility to assess,
# and does not itself prescribe a scoring formula or a safety judgement.
specialistReviewRequired: false
specialistReviewSignedBy: null

lifecycleState: draft
withdrawnAt: null

provenance: &paho
  sourceDocument: >-
    Resilient Hospitals: an inter-regional guidance on strengthening resilience to
    health emergencies and disasters in health facilities
  sourceLocation: "§1.1 Strategic Risk Assessment and Planning, pp. 36–38"
  issuingBody: Pan American Health Organization
  publicationDate: "2024-01-01"
  reviewStatus: unreviewed
  reproductionPermission: confirmed
  permissionEvidence: >-
    CC BY-NC-SA 3.0 IGO, stated on the document's own rights page: "Some rights
    reserved. This work is available under the Creative Commons
    Attribution-NonCommercial-ShareAlike 3.0 IGO license." © Pan American Health
    Organization, 2024. ISBN 978-92-75-12906-7 (PDF). Verified at source, not inferred.

# ⚠️ AN EMPTY EDITOR LIST MAKES THE SEPARATION RULE VACUOUS.
#
# `canApprove` refuses only if the approver is IN this list, or is submittedBy.
# With both empty it returns ok for ANYONE -- including whoever wrote the
# content. The rule that exists to guarantee an independent reviewer would have
# guaranteed nothing, while appearing to be enforced.
#
# So the authoring agent is recorded here. It is not a person and does not
# review; recording it is what gives the rule something to bite on.
editorial:
  editors:
    - agent:claude-opus-5
  submittedBy: agent:claude-opus-5

items:

  # --- p37 §1.1.1, bullet 1 -------------------------------------------------
  - id: HZ-HVCA-001-i01
    toolId: HZ-HVCA-001
    version: "1.0.0"
    title:
      key: item.hz_hvca_001_i01.title
      fallback: Identify the hazards this facility faces
    purpose:
      key: item.hz_hvca_001_i01.purpose
      fallback: >-
        Establish which hazards are credible here, before deciding what to prepare for.
    authorityClass: A
    classification: checklist
    lifecycleState: draft
    provenance:
      <<: *paho
      sourceLocation: "p. 37, §1.1.1 — first bullet"
    evidenceRule:
      key: item.hz_hvca_001_i01.evidence
      fallback: >-
        A written hazard list naming natural, biological, technological and societal
        hazards, each marked as affecting the hospital, the community, or both.
    capabilityBlockRef: cb-hazard-identification-001
    requiredRoles: [emergency-preparedness-lead]
    prerequisites: []
    reviewDate: "2027-08-16"

  # --- p37 §1.1.1, bullet 2 -------------------------------------------------
  - id: HZ-HVCA-001-i02
    toolId: HZ-HVCA-001
    version: "1.0.0"
    title:
      key: item.hz_hvca_001_i02.title
      fallback: Identify the vulnerabilities that make those hazards matter
    purpose:
      key: item.hz_hvca_001_i02.purpose
      fallback: >-
        A hazard becomes a risk through a weakness. Name the weaknesses.
    authorityClass: A
    classification: checklist
    lifecycleState: draft
    provenance:
      <<: *paho
      sourceLocation: "p. 37, §1.1.1 — second bullet"
    evidenceRule:
      key: item.hz_hvca_001_i02.evidence
      fallback: >-
        Vulnerabilities recorded across all three asset classes the source names —
        structural, nonstructural, and emergency management systems.
    capabilityBlockRef: cb-vulnerability-identification-001
    requiredRoles: [emergency-preparedness-lead, facilities-engineer]
    prerequisites: [HZ-HVCA-001-i01]
    reviewDate: "2027-08-16"

  # --- p37 §1.1.1, bullet 3 -------------------------------------------------
  - id: HZ-HVCA-001-i03
    toolId: HZ-HVCA-001
    version: "1.0.0"
    title:
      key: item.hz_hvca_001_i03.title
      fallback: Analyse what the consequences would actually be
    purpose:
      key: item.hz_hvca_001_i03.purpose
      fallback: >-
        Consequence, not likelihood alone, is what makes a hazard worth preparing for.
    authorityClass: A
    classification: checklist
    lifecycleState: draft
    provenance:
      <<: *paho
      sourceLocation: "p. 37, §1.1.1 — third bullet"
    evidenceRule:
      key: item.hz_hvca_001_i03.evidence
      fallback: >-
        For each priority hazard, consequences recorded for people, property, services,
        livelihoods and environment — in the hospital AND in the community.
    capabilityBlockRef: cb-consequence-analysis-001
    requiredRoles: [emergency-preparedness-lead]
    prerequisites: [HZ-HVCA-001-i01, HZ-HVCA-001-i02]
    reviewDate: "2027-08-16"

  # --- p37 §1.1.1, bullet 4 -------------------------------------------------
  - id: HZ-HVCA-001-i04
    toolId: HZ-HVCA-001
    version: "1.0.0"
    title:
      key: item.hz_hvca_001_i04.title
      fallback: Identify the capacities the facility can actually rely on
    purpose:
      key: item.hz_hvca_001_i04.purpose
      fallback: >-
        Capacity assumed is not capacity available. Record what is real.
    authorityClass: A
    classification: checklist
    lifecycleState: draft
    provenance:
      <<: *paho
      sourceLocation: "p. 37, §1.1.1 — fourth bullet"
    evidenceRule:
      key: item.hz_hvca_001_i04.evidence
      fallback: >-
        Capacities recorded for maintaining routine AND emergency operations, for
        leadership and management, and for coordination with local authorities —
        including capacity to support vulnerable groups.
    capabilityBlockRef: cb-capacity-identification-001
    requiredRoles: [emergency-preparedness-lead, hospital-director]
    prerequisites: [HZ-HVCA-001-i01]
    reviewDate: "2027-08-16"

  # --- p36 §1.1 -------------------------------------------------------------
  - id: HZ-HVCA-001-i05
    toolId: HZ-HVCA-001
    version: "1.0.0"
    title:
      key: item.hz_hvca_001_i05.title
      fallback: Reassess as the risk picture changes
    purpose:
      key: item.hz_hvca_001_i05.purpose
      fallback: >-
        The source is explicit that hazards, vulnerabilities and capacities are dynamic.
        An assessment done once is a document, not a practice.
    authorityClass: A
    classification: checklist
    lifecycleState: draft
    provenance:
      <<: *paho
      sourceLocation: "p. 36, §1.1 — 'as risks change over time, hospitals must continuously monitor'"
    evidenceRule:
      key: item.hz_hvca_001_i05.evidence
      fallback: >-
        A named owner and a scheduled review date exist for the assessment. The source
        prescribes no mandatory frequency, so the facility's own schedule is what counts.
    capabilityBlockRef: cb-assessment-review-cycle-001
    requiredRoles: [emergency-preparedness-lead]
    prerequisites: [HZ-HVCA-001-i01]
    reviewDate: "2027-08-16"

  # --- p38, Figure 4 (STAR-H cycle, step 05) --------------------------------
  - id: HZ-HVCA-001-i06
    toolId: HZ-HVCA-001
    version: "1.0.0"
    title:
      key: item.hz_hvca_001_i06.title
      fallback: Carry the findings into the response plan
    purpose:
      key: item.hz_hvca_001_i06.purpose
      fallback: >-
        An assessment that changes no plan has changed nothing.
    authorityClass: A
    classification: checklist
    lifecycleState: draft
    provenance:
      <<: *paho
      sourceLocation: "p. 38, Figure 4 — STAR-H cycle, step 05 'Incorporate results into EDRP-H'"
    evidenceRule:
      key: item.hz_hvca_001_i06.evidence
      fallback: >-
        Each priority hazard traces to a decision in the facility's emergency and
        disaster response plan — adopted, deferred with a reason, or explicitly declined.
    capabilityBlockRef: cb-plan-integration-001
    requiredRoles: [emergency-preparedness-lead, hospital-director]
    prerequisites: [HZ-HVCA-001-i03, HZ-HVCA-001-i04]
    reviewDate: "2027-08-16"
